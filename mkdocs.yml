site_name: Common Knowledge Scout
site_url: http://localhost:3000/docs
repo_url: https://github.com/bCommonsLAB/CommonKnowledgeScout
docs_dir: docs
site_dir: public/docs

theme:
  name: material
  language: en
use_directory_urls: false

# Nur die gepflegten Seiten werden gebaut und unter /docs ausgeliefert.
# docs/ ist zugleich Arbeitsordner der Entwicklung (Plaene, Analysen,
# Handover, Refactor) – das alles bleibt im Repo lesbar, gehoert aber nicht
# auf die Doku-Site. Neue Seite => hier freigeben UND unten in nav eintragen.
exclude_docs: |
  *
  !/index.md
  !/use-cases/
  !/use-cases/*.md
  !/operations/
  !/operations/*.md
  !/architecture/
  !/architecture/module-hierarchy.md
  !/architecture/dependency-graph.md
  !/architecture/shadow-twin.md
  !/architecture/pdf-transformation-phases.md
  !/architecture/mongodb-vector-search.md
  !/reference/
  !/reference/file-index.md
  !/reference/modules/
  !/reference/modules/*.md

plugins:
  - search
  - print-site:
      add_to_navigation: false
      print_page_title: 'Common Knowledge Scout – Complete Document'

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  # Overview: - Dateien existieren nicht
  #   - Start: overview/index.md
  #   - Intro: overview/intro.md
